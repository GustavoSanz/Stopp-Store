<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
    <defs>
        <!-- Gradients matching VeraWatt brand guidelines in Illustrator -->
        <linearGradient id="vwBoltGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4ade80"/>
            <stop offset="35%" stop-color="#22c55e"/>
            <stop offset="70%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#064e3b"/>
        </linearGradient>
        <linearGradient id="vwCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f1d36"/>
            <stop offset="100%" stop-color="#080f1d"/>
        </linearGradient>
        <filter id="vwGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>

    <!-- Squircle container (Dark Mode Artboard 1) -->
    <rect width="512" height="512" rx="128" fill="url(#vwCardBg)"/>
    <rect width="508" height="508" x="2" y="2" rx="126" stroke="rgba(74, 222, 128, 0.25)" stroke-width="4"/>

    <!-- Dynamic VeraWatt V+W Lightning Glyph -->
    <g transform="translate(64, 48) scale(0.75)" filter="url(#vwGlow)">
        <!-- Precise path traced from Illustrator vector artwork -->
        <path d="M 180 70 
                 L 350 70 
                 L 260 220 
                 L 330 220 
                 L 230 440 
                 L 270 330 
                 L 200 330 
                 L 255 190 
                 L 190 190 
                 L 225 120 
                 L 180 120 
                 Z" 
              fill="url(#vwBoltGrad)" />
    </g>
</svg>
