<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" fill="none">
    <defs>
        <linearGradient id="vwTitleGrad" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4ade80"/>
            <stop offset="50%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <filter id="vwTitleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- New VeraWatt Official Lightning Bolt Glyph -->
    <g transform="translate(4, 2) scale(0.12)" filter="url(#vwTitleGlow)">
        <path d="M 180 70 L 350 70 L 260 220 L 330 220 L 230 440 L 270 330 L 200 330 L 255 190 L 190 190 L 225 120 L 180 120 Z" fill="url(#vwTitleGrad)"/>
    </g>
    <!-- Brand Typography (Artboard 2 lockup) -->
    <text x="56" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="1.2" fill="#ffffff">Vera<tspan fill="url(#vwTitleGrad)">Watt</tspan></text>
    <text x="58" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="#94a3b8">SMART ENERGY &amp; GLYPH ECOSYSTEM</text>
</svg>
